# Mulqi Context Compression — DSH bundle patch layer.
#
# Mounts the fold (doctrine skill + four native tools) into every profile
# that lists this package in dsh.profile.bundles. The row's `name` is this
# package itself; the host loader resolves it from the profile's node_modules.
# No config surface is exposed; the engine's gates ship with documented
# defaults (see docs/engineering.md).
- insert:
    - id: mulqi-cc
      name: mulqi-context-compression
